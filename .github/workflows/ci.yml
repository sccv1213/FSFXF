name: Windows CI

on:
  push:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install av==18.0.0 PySide6==6.11.1 numpy==2.5.2

      - name: Install ffmpeg/ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # 当前进程显式补 PATH,避免 choco shim 未刷新导致 e2e 被跳过
          if (-not ($env:Path -like '*C:\ProgramData\chocolatey\bin*')) {
            $env:Path += ';C:\ProgramData\chocolatey\bin'
          }
          ffmpeg -version
          ffprobe -version

      - name: Run tests
        run: python -m unittest discover tests
